<!DOCTYPE html>
<html>
    <head>
        <title>Blackjack</title>
        <link
            rel="stylesheet"
            href="style.css" 
        />
        <link
            rel="stylesheet"
            type="text/css"
            href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
        />
    </head>
    <body>
        <main>
            <section class="side">
                <header>
                    <i class="ph ph-folder-simple"></i>
                    <h2>Project</h2>
                </header>
                <div class="project">
                    <div class="profile">
                        <img src="./avatar-img.jpeg" />
                        <div>
                            <h3>sambarberon</h3>
                            <p><a href="https://github.com/sambarberon">github.com/sambarberon</a></p>
                        </div>
                    </div>
                    <p class="soft-text">A simple Blackjack game built with vanilla JavaScript, using the <a href="https://www.deckofcardsapi.com">Deck of Cards API</a> for card management.</p>
                </div>
            </section>
            <section>
                <header>
                    <i class="ph ph-stack-simple"></i>
                    <h2>Table</h2>
                </header>
                <div class="table">
                    <div class="hand" id="dealer-el"></div>
                    <div id="result-el">
                        <p class="grey">//</p>
                        <p>Hit or Stand</p>
                    </div>
                    <div class="hand" id="player-el"></div>
                </div>
                <div class="btn-group">
                    <button id="draw-btn" disabled>Hit</button>
                    <button id="stand-btn" disabled>Stand</button>
                    <button id="new-round-btn">New Round</button>
                </div>
            </section>
            <section class="side">
                <header>
                    <i class="ph ph-clock-counter-clockwise"></i>
                    <h2>History</h2>
                </header>
                <div id="history-el">
                    <p class="muted">No round history yet</p>
                </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
